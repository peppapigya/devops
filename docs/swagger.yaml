basePath: /api/v1
definitions:
  common.Response:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
  dto.CreateHostDTO:
    properties:
      address:
        type: string
      hostName:
        type: string
      hostPassword:
        type: string
      hostPort:
        type: integer
      remark:
        type: string
      username:
        type: string
    required:
    - address
    - hostName
    - hostPassword
    - hostPort
    - username
    type: object
  dto.DeptPageRequest:
    properties:
      name:
        type: string
      pageNum:
        type: integer
      pageSize:
        type: integer
      status:
        type: string
    type: object
  dto.DeptSaveRequest:
    properties:
      email:
        type: string
      id:
        type: integer
      leaderUserId:
        type: integer
      name:
        type: string
      parentId:
        type: integer
      phone:
        type: string
      sort:
        type: integer
      status:
        type: integer
    type: object
  dto.DictTypePageRequest:
    properties:
      name:
        type: string
      pageNum:
        type: integer
      pageSize:
        type: integer
      status:
        type: string
      type:
        type: string
    type: object
  dto.DictTypeSaveRequest:
    properties:
      id:
        type: integer
      name:
        type: string
      remark:
        type: string
      status:
        type: integer
      type:
        type: string
    type: object
  dto.HostPageRequest:
    properties:
      keyword:
        type: string
      pageNum:
        type: integer
      pageSize:
        type: integer
    type: object
  dto.JobPlanLogPageRequest:
    properties:
      hostId:
        type: integer
      pageNum:
        type: integer
      pageSize:
        type: integer
      planId:
        type: integer
    type: object
  dto.JobPlanPageRequest:
    properties:
      name:
        type: string
      pageNum:
        type: integer
      pageSize:
        type: integer
    type: object
  dto.JobPlanSaveRequest:
    properties:
      globalVars:
        type: string
      hostGroupId:
        type: integer
      hostIds:
        type: string
      id:
        type: integer
      name:
        type: string
      remark:
        type: string
      scriptIds:
        description: 关联的脚本ID列表
        items:
          type: integer
        type: array
    required:
    - name
    type: object
  dto.JobScheduledTaskPageRequest:
    properties:
      name:
        type: string
      pageNum:
        type: integer
      pageSize:
        type: integer
      status:
        type: integer
    type: object
  dto.JobScheduledTaskSaveRequest:
    properties:
      id:
