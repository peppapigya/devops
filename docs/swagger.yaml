        type: string
      planId:
        type: integer
      status:
        type: integer
      strategy:
        type: string
    required:
    - name
    - planId
    - strategy
    type: object
  dto.JobScriptPageRequest:
    properties:
      name:
        type: string
      pageNum:
        type: integer
      pageSize:
        type: integer
      type:
        type: string
    type: object
  dto.JobScriptSaveRequest:
    properties:
      category:
        type: string
      content:
        type: string
      env:
        type: string
      id:
        type: integer
      name:
        type: string
      parameters:
        type: string
      timeout:
        type: integer
      type:
        type: string
      workDir:
        type: string
    required:
    - name
    - type
    type: object
  dto.LoginRequest:
    properties:
      captchaId:
        type: string
      code:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - captchaId
    - code
    - password
    - username
    type: object
  dto.MenuCreateDTO:
    properties:
      always_show:
        type: boolean
      component:
        type: string
      componentName:
        type: string
      icon:
        maxLength: 100
        type: string
      keepAlive:
        type: boolean
      name:
        maxLength: 50
        minLength: 1
        type: string
      parentId:
        minimum: 0
        type: integer
      path:
        maxLength: 200
        type: string
      permission:
        maxLength: 100
        minLength: 1
        type: string
      sort:
        minimum: 0
        type: integer
      type:
        description: 1:目录 2:菜单 3:按钮
        enum:
        - 1
        - 2
        - 3
        type: integer
      visible:
        type: boolean
    required:
    - name
    - permission
    - sort
    - type
    type: object
  dto.MenuUpdateDTO:
    properties:
      alwaysShow:
        type: boolean
      component:
        type: string
      componentName:
        type: string
      icon:
        maxLength: 100
        type: string
      id:
        minimum: 1
        type: integer
      keepAlive:
        type: boolean
      name:
        maxLength: 50
        minLength: 1
        type: string
      parentId:
        type: integer
      path:
        maxLength: 200
        type: string
      permission:
        maxLength: 100
        minLength: 0
        type: string
      sort:
        minimum: 0
        type: integer
      status:
        type: integer
      type:
        enum:
        - 1
        - 2
        - 3
        type: integer
      visible:
        type: boolean
    required:
    - id
    - name
    - permission
    - sort
    - type
    type: object
  dto.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  dto.UpdateHostDTO:
    properties:
      address:
        type: string
      hostName:
        type: string
      hostPassword:
        type: string
      hostPort:
        type: integer
      id:
        type: integer
      remark:
        type: string
      username:
        type: string
    required:
    - address
    - hostName
    - hostPort
    - id
    - username
    type: object
  dto.UserPageRequest:
    properties:
      pageNum:
        default: 1
        type: integer
      pageSize:
        default: 10
        type: integer
      userName:
        type: string
    type: object
  dto.UserSaveRequest:
    properties:
      avatar:
        description: 头像地址
        type: string
      dept_id:
        description: 部门ID
        type: integer
      email:
        description: 用户邮箱
        type: string
      id:
        description: 用户ID
        type: integer
      login_date:
        description: 最后登录时间
        type: string
      login_ip:
        description: 最后登录IP
        type: string
      mobile:
        description: 手机号码
        type: string
      nickname:
        description: 用户昵称
        type: string
      post_ids:
        description: 岗位编号数组
        type: string
      remark:
        description: 备注
        type: string
      sex:
        description: 用户性别
        type: integer
      status:
        description: 帐号状态（0正常 1停用）
        type: integer
      username:
        description: 用户账号
        type: string
    type: object
host: localhost:8081
